{% extends "base.html" %}

{% block title %}Зворотній зв'язок{% endblock %}
{% block content %}

<body>
    <div class="form-container">
        <form class="feedback-form" method="POST">
            <h2>Поділіться своїми враженнями</h2>

            <div>
                <input type="text" id="name" name="name" required placeholder="Ваше ім'я">
            </div>

            <div>
                <input type="email" id="email" name="email" required placeholder="Ваш email">
            </div>

            <div>
                <textarea id="message" name="message" required rows="5" placeholder="Введіть ваше повідомлення..."></textarea>
            </div>

            <button type="submit">Надіслати</button>
        </form>
    </div>

</body>
{% endblock %}
