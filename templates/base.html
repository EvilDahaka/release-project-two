<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <title>{% block title %}gShop{% endblock %}</title>
</head>
<body>
  <header>
    <div class="logo">gShop</div>
    <input type="text" placeholder="Пошук товарів">
    <button class="btn">Знайти</button>
    <nav>
      <a href="{{ url_for('home') }}">Головна</a>
      <a href="{{ url_for('feedback') }}">Зворотній зв'язок</a>
      {% if auth %}
      <a href="{{ url_for('user.logout') }}">Вихід</a>
      <p class="me-3 py-2 link-body-emphasis text-decoration-none" >{{ username }}</p>
      {% else %}
      <a href="{{ url_for('user.login') }}">Ввійти</a>
      <a href="{{ url_for('user.register') }}">Реєстрація</a>
      {% endif %}

    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
